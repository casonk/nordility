qualified-name="ENTRY_PANEL.API" data-source-line="24" id="ent0005"><rect fill="#DAE8FC" height="85.3765" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="173.0732" x="487.4007" y="248.7885"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="129.6369" x="497.4007" y="271.6166">Public Package Surface</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="72.1445" x="497.4007" y="287.9607">src/nordility/</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" text-decoration="underline" textLength="17.9401" x="569.5452" y="287.9607">init</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="16.7161" x="587.4854" y="287.9607">.py</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="153.0732" x="497.4007" y="304.3048">- re-exports NordVPNClient</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="125.1369" x="497.4007" y="320.6489">- compatibility helpers</text></g><!--entity CONFIG--><g class="entity" data-qualified-name="CORE_PANEL.CONFIG" data-source-line="28" id="ent0007"><rect fill="#D5E8D4" height="183.4411" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="200.3493" x="637.1698" y="549.5091"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="141.049" x="647.1698" y="572.3372">Configuration Resolution</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="114.5888" x="647.1698" y="588.6813">resolve_executable()</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="69.0485" x="647.1698" y="605.0254">- explicit arg</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="146.749" x="647.1698" y="621.3695">- NORDILITY_EXECUTABLE</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="142.441" x="647.1698" y="637.7136">- NORDVPN_EXECUTABLE</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="130.4289" x="647.1698" y="654.0577">- default Windows path</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="3.12" x="647.1698" y="670.4019">&#160;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="101.0647" x="647.1698" y="686.746">resolve_backend()</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="115.8488" x="647.1698" y="703.0901">- auto / windows / cli</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="180.3493" x="647.1698" y="719.4342">- NORDILITY_BACKEND override</text></g><!--entity CLIENT--><g class="entity" data-qualified-name="CORE_PANEL.CLIENT" data-source-line="30" id="ent0008"><rect fill="#D5E8D4" height="118.0647" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="242.4096" x="237.3632" y="849.4234"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="84.5886" x="247.3632" y="872.2515">NordVPNClient</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="175.5132" x="247.3632" y="888.5956">- connect / disconnect / change</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="141.793" x="247.3632" y="904.9397">- list_groups / pick_group</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="133.3209" x="247.3632" y="921.2838">- build command tuples</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="120.5049" x="247.3632" y="937.6279">- dispatch to backend</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="222.4096" x="247.3632" y="953.9721">- inject launcher / runner / sleeper / rng</text></g><!--entity TOKEN--><g class="entity" data-qualified-name="CORE_PANEL.TOKEN" data-source-line="32" id="ent0009"><rect fill="#D5E8D4" height="134.4088" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="201.8973" x="223.9698" y="1038.0473"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="110.3528" x="233.9698" y="1060.8754">Token Login Broker</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="152.3291" x="233.9698" y="1077.2195">- root-owned CLI validation</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="147.745" x="233.9698" y="1093.5636">- no credential in argv/env</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="181.8973" x="233.9698" y="1109.9077">- exact NordVPN 5.2 PTY prompt</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="154.9931" x="233.9698" y="1126.2518">- require ECHO/ECHONL off</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="146.173" x="233.9698" y="1142.5959">- read + wipe private stdin</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="129.2529" x="233.9698" y="1158.9401">- suppress child output</text></g><!--entity WATCH--><g class="entity" data-qualified-name="CORE_PANEL.WATCH" data-source-line="34" id="ent0010"><rect fill="#D5E8D4" height="134.4088" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="316.7622" x="499.7728" y="843.2944"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="111.4448" x="509.7728" y="866.1224">WireGuard Watcher</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="157.5491" x="509.7728" y="882.4666">watch_nordvpn_wireguard()</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="210.3975" x="509.7728" y="898.8107">- poll nordvpn status + nordlynx state</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="169.5132" x="509.7728" y="915.1548">- start configured wg0 if down</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="296.7622" x="509.7728" y="931.4989">- filter config-owned interfaces before peer mutation</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="183.7933" x="509.7728" y="947.843">- reject daemon-owned nordlynx</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="248.4378" x="509.7728" y="964.1871">- exact fwmark/rule/protocol-196 ownership</text></g><!--entity WEB--><g class="entity" data-qualified-name="CORE_PANEL.WEB" data-source-line="36" id="ent0011"><rect fill="#D5E8D4" height="118.0647" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="218.4574" x="1155.8232" y="846.5632"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="70.3325" x="1165.8232" y="869.3913">Web Control</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="112.4408" x="1165.8232" y="885.7354">src/nordility/web.py</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="198.4574" x="1165.8232" y="902.0795">- root:caddy Unix socket for actions</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="105.6488" x="1165.8232" y="918.4236">- TCP is status-only</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="186.7213" x="1165.8232" y="934.7677">- exact HTTPS Origin/Host + JSON</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="168.5533" x="1165.8232" y="951.1118">- power / rotate / group select</text></g><!--entity GROUPS--><g class="entity" data-qualified-name="CORE_PANEL.GROUPS" data-source-line="38" id="ent0012"><rect fill="#D5E8D4" height="85.3765" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="193.0772" x="857.5191" y="614.8855"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="69.4925" x="867.5191" y="637.7136">Group Pools</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="172.4772" x="867.5191" y="654.0577">FAST_GROUPS / FULL_GROUPS</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="173.0772" x="867.5191" y="670.4019">- underscore-separated names</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="103.4888" x="867.5191" y="686.746">- fast/full selection</text></g><!--entity RESULT--><g class="entity" data-qualified-name="CORE_PANEL.RESULT" data-source-line="40" id="ent0013"><rect fill="#D5E8D4" height="101.7206" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="162.681" x="1341.5891" y="576.7493"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="82.4766" x="1351.5891" y="599.5774">Result + Errors</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="93.6367" x="1351.5891" y="615.9215">CommandResult</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="106.8728" x="1351.5891" y="632.2656">ConfigurationError</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="142.681" x="1351.5891" y="648.6097">CommandExecutionError</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="77.2566" x="1351.5891" y="664.9538">NordilityError</text></g><!--entity WIN--><g class="entity" data-qualified-name="BACKEND_PANEL.WIN" data-source-line="44" id="ent0015"><rect fill="#FFE6CC" height="101.7206" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="192.9813" x="132.9396" y="1324.1443"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="102.8767" x="142.9396" y="1346.9724">Windows Backend</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="110.4488" x="142.9396" y="1363.3165">- subprocess.Popen</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="172.4413" x="142.9396" y="1379.6607">- NordVPN.exe flags: -c / -d / -g</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="172.9813" x="142.9396" y="1396.0048">- preserves group underscores</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="155.9771" x="142.9396" y="1412.3489">- optional post-launch sleep</text></g><!--entity CLIBACK--><g class="entity" data-qualified-name="BACKEND_PANEL.CLIBACK" data-source-line="46" id="ent0016"><rect fill="#FFE6CC" height="101.7206" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="224.8655" x="345.9209" y="1324.1443"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="69.3245" x="355.9209" y="1346.9724">CLI Backend</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="94.1527" x="355.9209" y="1363.3165">- subprocess.run</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="168.1212" x="355.9209" y="1379.6607">- nordvpn connect/disconnect</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="184.5854" x="355.9209" y="1396.0048">- converts underscores to spaces</text><text fill="#000