name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full-history scan — Sundays at 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks CLI
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      # A single full-history scan on every trigger. The previous push/pull_request
      # path used gitleaks-action@v2, which has no way to consume
      # .gitleaks-baseline.json — so accepted historical findings were re-reported
      # whenever a push range happened to include the commit that introduced them,
      # and whether CI passed depended on the shape of the push rather than on the
      # contents of the repository. Scanning --all with the baseline applied is
      # deterministic and still fails on any finding that is not already accepted.
      - name: Run Gitleaks (full history with baseline)
        run: |
          set -euo pipefail
          args=(
            detect
            --redact
            -v
            --exit-code=2
            --report-format=sarif
            --report-path=results.sarif
            --log-level=debug
            --log-opts=--all
          )
          if [ -f .gitleaks-baseline.json ]; then
            args+=(--baseline-path .gitleaks-baseline.json)
          else
            echo "No .gitleaks-baseline.json present; scanning without a baseline."
          fi
          /tmp/gitleaks "${args[@]}"

      - name: Upload Gitleaks SARIF
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results.sarif
          path: results.sarif
